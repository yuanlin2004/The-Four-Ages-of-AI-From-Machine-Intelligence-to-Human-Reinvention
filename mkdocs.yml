site_name: The Four Ages of AI
site_description: How Humanity Lost — and Rediscovered — Itself. An essay on authenticity, agency, purpose and human reinvention in the age of AI.
site_url: https://rooagi.github.io/The-Four-Ages-of-AI-From-Machine-Intelligence-to-Human-Reinvention/
repo_url: https://github.com/RooAGI/The-Four-Ages-of-AI-From-Machine-Intelligence-to-Human-Reinvention
repo_name: RooAGI / The Four Ages of AI
edit_uri: edit/main/docs/
theme:
  name: material
  logo: assets/rooagi-logo.png
  favicon: assets/rooagi-logo.png
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit
    - navigation.indexes
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
copyright: '© 2026 RooAGI Corporation. All rights reserved.'
extra_css:
  - stylesheets/extra.css
nav:
  - Overview: index.md
  - Age I · The Mirror: age-1-mirror.md
  - Age II · The Surrender: age-2-surrender.md
  - Age III · The Irrelevance: age-3-irrelevance.md
  - Age IV · The Becoming: age-4-becoming.md
  - Synthesis · Human Reinvention: human-reinvention.md
  - Technical companions:
      - technical/index.md
      - Architecture and the Transformer: technical/architecture-and-the-transformer.md
      - Scaling and parallel computation: technical/scaling-and-parallel-computation.md
      - Agents, software and trust: technical/agents-and-trust.md
      - AI for science: technical/ai-for-science.md
  - References: references.md
